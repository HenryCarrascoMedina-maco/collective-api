sonar.projectKey=collective-api
sonar.projectName=collective-api
sonar.sourceEncoding=UTF-8

# En .NET el escaner envuelve la compilacion (dotnet sonarscanner begin/end),
# asi que sources y tests los descubre solo. Este archivo documenta las
# exclusiones y el informe de cobertura.

sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.coverage.exclusions=**/Program.cs,**/Migrations/**,**/*Dto.cs

# SonarQube necesita OpenCover en .NET. El formato "cobertura" que Coverlet
# genera por defecto NO se lee: es la causa numero uno de cobertura a cero.
